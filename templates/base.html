<!DOCTYPE html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}INF37407 — TP1 AniList{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"

        crossorigin="anonymous" referrerpolicy="no-referrer">
  {% block extra_head %}{% endblock %}

<body class="bg-light">

    <div class="container">
      <a class="navbar-brand" href="{% url 'stats-dashboard' %}">INF37407 — TP1</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navPublic"

        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navPublic">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{% url 'stats-dashboard' %}">Statistiques</a></li>
          <li class="nav-item"><a class="nav-link" href="/admin/">Admin</a></li>

        </ul>
      </div>
    </div>

  <main class="container pb-5">
    {% block content %}{% endblock %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"

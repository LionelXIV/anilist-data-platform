# Pipeline Railway : collectstatic + migrations avant Gunicorn.
# Fichier nécessaire : Nixpacks n'infère pas collectstatic ni le bind $PORT.

[build]
builder = "DOCKERFILE"

[deploy]
releaseCommand = "python manage.py collectstatic --noinput && python manage.py migrate --noinput"
startCommand = "sh /app/start.sh"
restartPolicyType = "ON_FAILURE"
